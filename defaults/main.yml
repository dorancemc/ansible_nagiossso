---
nagiossso_enabled: false

nagiossso_provider_metadata_url: ""
nagiossso_client_id: ""
nagiossso_client_secret: ""
nagiossso_crypto_passphrase: ""

nagiossso_redirect_uri: "https://{{ inventory_hostname }}/nagios4/redirect_uri"
nagiossso_scope: openid email profile
nagiossso_remote_user_claim: email
nagiossso_pkce_method: S256
nagiossso_session_inactivity_timeout: 3600
nagiossso_session_max_duration: 28800

# Destinos que mod_auth_openidc acepta en los parametros ?logout= y
# ?target_link_uri= de la redirect URI. Son EXPRESIONES REGULARES, no URLs
# literales, y sin anclar coinciden parcialmente: un patron laxo convierte la
# redirect URI en un open redirect.
#
# Vacio conserva el comportamiento por defecto del modulo, que solo admite
# destinos del propio host y devuelve 400 con cualquier otro. En cuanto se
# define un patron esa regla por host DEJA de aplicarse y la lista pasa a ser la
# unica fuente, asi que el propio sitio tiene que aparecer en ella.
nagiossso_redirect_urls_allowed: []

nagiossso_protected_paths:
  - /etc/nagios4/stylesheets
  - /usr/lib/cgi-bin/nagios4
  - /usr/share/nagios4/htdocs

nagiossso_pnp4nagios_path: /usr/local/pnp4nagios/share

nagiossso_breakglass_enabled: true
nagiossso_breakglass_address: 127.0.0.1
nagiossso_htpasswd_file: /etc/nagios4/htpasswd.users

nagiossso_manage_action: false
nagiossso_auth0_domain: ""
nagiossso_auth0_mgmt_client_id: ""
nagiossso_auth0_mgmt_client_secret: ""
nagiossso_auth0_action_name: nagios-allowlist
nagiossso_auth0_action_runtime: node22
nagiossso_auth0_no_log: true

nagiossso_allowed_domains: []
nagiossso_allowed_emails: >-
  {{ __nagiossso_sso_contacts | difference(__nagiossso_absent_contacts) | sort }}
nagiossso_allow_empty_allowlist: false

# Claim de pertenencia a organizaciones, para aplicaciones que resuelven el
# acceso con el token en vez de con su propia lista. Vacio = no se emite y el
# codigo de la Action no cambia.
nagiossso_claim_namespace: ""
nagiossso_claim_client_ids: []
nagiossso_claim_allowed_values: []
nagiossso_claim_operator_group: ""
nagiossso_claim_operator_value: ""
nagiossso_claim_values: "{{ __nagiossso_claim_values | default({}) }}"

nagiossso_packages: "{{ __nagiossso_packages[ansible_facts['os_family']] }}"
nagiossso_apache_service: "{{ __nagiossso_apache_service[ansible_facts['os_family']] }}"
nagiossso_apache_conf_dir: "{{ __nagiossso_apache_conf_dir[ansible_facts['os_family']] }}"
nagiossso_apache_conf_file: zz-nagiossso.conf
nagiossso_apache_configtest: /usr/sbin/apachectl -t
